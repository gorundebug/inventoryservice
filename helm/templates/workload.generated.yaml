{{- if and (ne .Values.workloadType "Deployment") .Values.deploymentStrategy }}
{{ fail "deploymentStrategy requires Deployment" }}
{{- end }}
{{- if and (ne .Values.workloadType "StatefulSet") .Values.updateStrategy }}
{{ fail "updateStrategy requires StatefulSet" }}
{{- end }}
{{- if and (eq (default "" .Values.deploymentStrategy.type) "Recreate") .Values.deploymentStrategy.rollingUpdate }}
{{ fail "Recreate cannot contain rollingUpdate settings" }}
{{- end }}
{{- if and (eq (default "" .Values.updateStrategy.type) "OnDelete") .Values.updateStrategy.rollingUpdate }}
{{ fail "OnDelete cannot contain rollingUpdate settings" }}
{{- end }}
{{- $containerNames := dict (include "inventoryservice.name" .) true }}
{{- range $group := list .Values.initContainers .Values.extraContainers }}
{{- range $group }}
{{- if hasKey $containerNames .name }}
{{ fail "Pod container names must be unique" }}
{{- end }}
{{- $_ := set $containerNames .name true }}
{{- end }}
{{- end }}
{{- $envNames := dict }}
{{- range .Values.extraEnv }}
{{- if or (hasKey $envNames .name) (hasKey $.Values.secretEnv .name) }}
{{ fail "Explicit environment names must be unique" }}
{{- end }}
{{- $_ := set $envNames .name true }}
{{- end }}
apiVersion: apps/v1
kind: {{ .Values.workloadType }}
metadata:
  name: {{ include "inventoryservice.fullname" . }}
  labels:
    {{ include "inventoryservice.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if eq .Values.workloadType "StatefulSet" }}
  serviceName: {{ printf "%s-headless" (include "inventoryservice.fullname" .) }}
  {{- end }}
  {{- if and (eq .Values.workloadType "Deployment") .Values.deploymentStrategy }}
  strategy:
    {{ toYaml .Values.deploymentStrategy | nindent 4 }}
  {{- end }}
  {{- if and (eq .Values.workloadType "StatefulSet") .Values.updateStrategy }}
  updateStrategy:
    {{ toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{ include "inventoryservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{ include "inventoryservice.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.generated.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ default "default" .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if ne .Values.terminationGracePeriodSeconds nil }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "inventoryservice.name" . }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{ toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.command }}
          command:
            {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{ toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "inventoryservice.fullname" . }}
            {{- range .Values.secretEnvFrom }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.extraEnv .Values.secretEnv }}
          env:
            {{- with .Values.extraEnv }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
            {{- range $name, $secret := .Values.secretEnv }}
            - name: {{ $name | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.name | quote }}
                  key: {{ $secret.key | quote }}
                  {{- if hasKey $secret "optional" }}
                  optional: {{ $secret.optional }}
                  {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 9092
              protocol: TCP
            - name: grpc
              containerPort: 9202
              protocol: TCP
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            {{- if .Values.probes.startup.spec }}
            {{ toYaml .Values.probes.startup.spec | nindent 12 }}
            {{- else }}
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- if .Values.probes.readiness.spec }}
            {{ toYaml .Values.probes.readiness.spec | nindent 12 }}
            {{- else }}
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- if .Values.probes.liveness.spec }}
            {{ toYaml .Values.probes.liveness.spec | nindent 12 }}
            {{- else }}
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            {{- end }}
          {{- end }}
          resources:
            {{ toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{ toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.extraContainers }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
      {{- end }}
  {{- if and (eq .Values.workloadType "StatefulSet") .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{ toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}