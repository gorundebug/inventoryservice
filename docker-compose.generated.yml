services:
  inventoryservice:
    image: inventoryservice:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
        RUNTIME_STRIP: ${RUNTIME_STRIP:-ON}
        DEPENDENCY_GITHUB_RAW_URL: ${DEPENDENCY_GITHUB_RAW_URL:-https://github.com}
        DEPENDENCY_APT_DEBIAN_URL: ${DEPENDENCY_APT_DEBIAN_URL:-}
        DEPENDENCY_APT_DEBIAN_SECURITY_URL: ${DEPENDENCY_APT_DEBIAN_SECURITY_URL:-}
      additional_contexts:
        servicelib-source: "${GOSERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/servicelib.git#v0.2.57}"
        module-inventory_service_api-source: "${INVENTORY_SERVICE_API_SOURCE_CONTEXT:-https://github.com/gorundebug/inventory_service_api.git#v0.2.57}"
        module-model_go-source: "${MODEL_GO_SOURCE_CONTEXT:-https://github.com/gorundebug/model_go.git#v0.2.57}"
    environment:
      - DEBUG=${DEBUG:-0}
      - INVENTORY_SERVICE_HTTP_PORT
      - INVENTORY_SERVICE_GRPC_PORT
    ports:
      - "${INVENTORY_SERVICE_HOST_HTTP_PORT:-9092}:${INVENTORY_SERVICE_HTTP_PORT:-9092}"
      - "${INVENTORY_SERVICE_HOST_GRPC_PORT:-9202}:${INVENTORY_SERVICE_GRPC_PORT:-9202}"